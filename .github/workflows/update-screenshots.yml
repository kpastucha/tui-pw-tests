name: Update Playwright Screenshots

on:
  workflow_dispatch:
    inputs:
      workers_count:
        description: 'Select number of workers'
        required: true
        default: 1
        type: choice
        options:
          - '1'
          - '2'
          - '3'          
      retries_count:
        description: 'Select number of retries'
        required: true
        default: '0'
        type: choice
        options:
          - '0'
          - '1'
          - '2'

jobs:
  update-screenshots:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npm run test:setup

      - name: Update Screenshots
        run: npm run test:update
        env:
          PLAYWRIGHT_WORKERS: ${{ github.event.inputs.workers_count }}
          PLAYWRIGHT_RETRIES: ${{ github.event.inputs.retries_count }}

      - name: Upload Updated Screenshots
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: updated-playwright-screenshots
          path: screenshots/
          retention-days: 7
